name: CI

# Every push and pull request builds and tests on Linux x64 (GCC and Clang, with AddressSanitizer and
# UndefinedBehaviorSanitizer) and Linux arm64. macOS (arm64 and x64) and Windows (x64 and arm64) run on pushes to main,
# once a day and on demand, and on every event once the repository is public.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc, runner: ubuntu-24.04, cc: gcc, cxx: g++, sanitize: 'ON' }
          - { name: linux-x64-clang, runner: ubuntu-24.04, cc: clang, cxx: clang++, sanitize: 'ON' }
          # The sanitizers run the tests that build very deep or very large trees several hundred times slower on
          # arm64 (minutes per test), so the arm64 job builds without them; both x64 jobs run them.
          - { name: linux-arm64-gcc, runner: ubuntu-24.04-arm, cc: gcc, cxx: g++, sanitize: 'OFF' }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The sanitizers slow the large-input parse tests down many times, so these jobs check their results and leave
      # their time bounds to the Release jobs below.
      - name: Configure (Debug, sanitizers ${{ matrix.sanitize }})
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEOJSON_SANITIZE=${{ matrix.sanitize }} -DNEOJSON_TEST_TIME_BOUNDS=OFF -DNEOJSON_BUILD_EXAMPLES=ON
      - name: Show the compiler and the flags the build uses
        run: grep -E 'CMAKE_CXX_COMPILER:|NEOJSON_SANITIZE:' build/CMakeCache.txt
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900
      - name: Build and install packaging target (Release)
        run: |
          cmake -S . -B build-pkg -DCMAKE_BUILD_TYPE=Release -DNEOJSON_BUILD_TESTS=OFF -DNEOJSON_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build-pkg-install"
          cmake --build build-pkg --parallel
          cmake --install build-pkg
      - name: Smoke test find_package consumer
        run: |
          cmake -S tests/packaging -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-pkg-install"
          cmake --build build-consumer --parallel
          ctest --test-dir build-consumer --output-on-failure
      - name: Smoke test pkg-config consumer
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y pkg-config
          fi
          PC_DIR="$(dirname "$(find "${{ github.workspace }}/build-pkg-install" -name neojson.pc -print -quit)")"
          test -n "$PC_DIR"
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --exact-version=0.1.0 --cflags --libs neojson
          $CXX -std=c++17 tests/packaging/consumer.cpp $(PKG_CONFIG_PATH="$PC_DIR" pkg-config --cflags --libs neojson) -o build-consumer/consumer_pc
          ./build-consumer/consumer_pc
      - name: Smoke test add_subdirectory consumer (BUILD_SHARED_LIBS=ON)
        run: |
          cmake -S tests/packaging -B build-subdir -DCMAKE_BUILD_TYPE=Release -DNEOJSON_CONSUMER_USE_SUBDIRECTORY=ON -DNEOJSON_SOURCE_DIR="${{ github.workspace }}" -DBUILD_SHARED_LIBS=ON
          cmake --build build-subdir --parallel
          ctest --test-dir build-subdir --output-on-failure
          if nm -D build-subdir/neojson_sub/libneojson.so | grep -E ' (yyjson_|unsafe_yyjson_)'; then
            echo "ERROR: vendored yyjson symbols leaked from libneojson.so"
            exit 1
          fi
      - name: Smoke test shared install and find_package consumer
        run: |
          cmake -S . -B build-pkg-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DNEOJSON_BUILD_TESTS=OFF -DNEOJSON_BUILD_EXAMPLES=OFF
          cmake --build build-pkg-shared --parallel
          cmake --install build-pkg-shared --prefix "${{ github.workspace }}/build-pkg-shared-install"
          cmake -S tests/packaging -B build-consumer-shared -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-pkg-shared-install"
          cmake --build build-consumer-shared --parallel
          ctest --test-dir build-consumer-shared --output-on-failure

  other-platforms:
    name: ${{ matrix.name }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x64, runner: macos-15-intel }
          - { name: windows-x64-msvc, runner: windows-2022 }
          - { name: windows-arm64-msvc, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOJSON_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 900
      - name: Install (Release)
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/build-install"
      - name: Configure packaging consumer (find_package)
        run: cmake -S tests/packaging -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-install"
      - name: Build packaging consumer
        run: cmake --build build-consumer --config Release --parallel
      - name: Run packaging consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure
      - name: Configure subdirectory consumer (BUILD_SHARED_LIBS=ON)
        run: cmake -S tests/packaging -B build-subdir -DCMAKE_BUILD_TYPE=Release -DNEOJSON_CONSUMER_USE_SUBDIRECTORY=ON -DNEOJSON_SOURCE_DIR="${{ github.workspace }}" -DBUILD_SHARED_LIBS=ON
      - name: Build subdirectory consumer
        run: cmake --build build-subdir --config Release --parallel
      - name: Run subdirectory consumer
        run: ctest --test-dir build-subdir -C Release --output-on-failure
