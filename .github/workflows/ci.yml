name: CI

# Every push and pull request runs the two Linux jobs (x64 with sanitizers, arm64). The whole matrix (Linux,
# macOS and Windows on x64 and arm64) runs on a push to main, once a day, and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the whole platform matrix"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full)) && '[
          {"name":"linux-x64-gcc-sanitizers","os":"ubuntu-24.04","cc":"gcc","cxx":"g++","sanitize":"ON"},
          {"name":"linux-x64-clang-sanitizers","os":"ubuntu-24.04","cc":"clang","cxx":"clang++","sanitize":"ON"},
          {"name":"linux-arm64-gcc","os":"ubuntu-24.04-arm","cc":"gcc","cxx":"g++","sanitize":"OFF"},
          {"name":"macos-arm64","os":"macos-15","cc":"clang","cxx":"clang++","sanitize":"OFF"},
          {"name":"macos-x64","os":"macos-15-intel","cc":"clang","cxx":"clang++","sanitize":"OFF"},
          {"name":"windows-x64-msvc","os":"windows-2022","cc":"","cxx":"","sanitize":"OFF"},
          {"name":"windows-arm64-msvc","os":"windows-11-arm","cc":"","cxx":"","sanitize":"OFF"}]' || '[
          {"name":"linux-x64-gcc-sanitizers","os":"ubuntu-24.04","cc":"gcc","cxx":"g++","sanitize":"ON"},
          {"name":"linux-arm64-gcc","os":"ubuntu-24.04-arm","cc":"gcc","cxx":"g++","sanitize":"OFF"}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Debug -DJSONKIT_SANITIZE=${{ matrix.platform.sanitize }})
          if [ -n "${{ matrix.platform.cxx }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.platform.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.platform.cxx }})
          fi
          cmake "${args[@]}"
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 900
